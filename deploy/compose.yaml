# Production stack for the VPS (ADR 0007). It lives in the deploy directory next to a `.env`
# (template: deploy/.env.example); CI uploads this file and runs deploy.sh on every push to master.
# Logs of the app services go to Graylog over GELF (ADR 0009); `docker compose logs` keeps
# working thanks to Docker's dual logging.
name: cbf-ref

# GELF to the Graylog input published on the host's loopback (the daemon sends, not a container)
x-gelf: &gelf
  driver: gelf
  options:
    gelf-address: udp://127.0.0.1:${GELF_PORT:-12201}
    tag: '{{.Name}}'

# the logging stack itself logs locally (it cannot ship logs to itself before it is up)
x-local-logging: &local-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '5'

x-app: &app
  image: ghcr.io/sberan1/cbf-ref-interface:${IMAGE_TAG:-latest}
  restart: unless-stopped
  init: true
  env_file: .env
  environment:
    DATABASE_URL: postgres://cbf:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@cbf-ref-db:5432/cbf
    AMQP_URL: amqp://cbf:${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}@cbf-ref-rabbitmq:5672
  logging: *gelf

# the sync processes need the queue as well
x-after-migrations: &after-migrations
  db:
    condition: service_healthy
  rabbitmq:
    condition: service_healthy
  migrate:
    condition: service_completed_successfully

services:
  db:
    image: postgres:17
    restart: unless-stopped
    # the app also sits on the proxy network, where a plain `db` may be another stack's database
    networks:
      default:
        aliases: [cbf-ref-db]
    shm_size: 256mb
    environment:
      POSTGRES_USER: cbf
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: cbf
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # over TCP: the init-time server listens only on the socket
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U cbf -d cbf']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
      start_interval: 2s
    logging: *gelf

  rabbitmq:
    image: rabbitmq:4-management
    restart: unless-stopped
    networks:
      default:
        aliases: [cbf-ref-rabbitmq]
    # the node name (rabbit@rabbitmq) selects the data directory, so it must survive recreation
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: cbf
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}
    ports:
      # management UI, only through an SSH tunnel: ssh -L 15672:127.0.0.1:15672 <vps>
      - 127.0.0.1:${RABBITMQ_UI_PORT:-15672}:15672
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
      start_interval: 5s
    logging: *gelf

  # one-shot: applies drizzle/ migrations before the new app/worker start (idempotent)
  migrate:
    <<: *app
    restart: 'no'
    command: ['node', 'dist/migrate.js']
    depends_on:
      db:
        condition: service_healthy

  app:
    <<: *app
    command: ['node', 'build']
    ports:
      # a reverse proxy on the host forwards here (see deploy/nginx.conf.example)
      - 127.0.0.1:${APP_PORT:-3000}:3000
    networks:
      default:
      # a reverse proxy running in Docker (Nginx Proxy Manager) reaches the app as cbf-ref-app:3000
      proxy:
        aliases: [cbf-ref-app]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/healthz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 2s

  # fetch + normalize consumers; SIGTERM lets the in-flight task finish
  worker:
    <<: *app
    command: ['node', 'dist/cbf.js', 'worker']
    stop_grace_period: 60s
    depends_on: *after-migrations

  # enqueues the daily refresh (CBF_DAILY_AT) and the game window (CBF_WINDOW_EVERY_HOURS)
  scheduler:
    <<: *app
    command: ['node', 'dist/cbf.js', 'scheduler']
    depends_on: *after-migrations

  # --- logging (ADR 0009) ---------------------------------------------------------------------

  mongodb:
    image: mongo:7.0
    restart: unless-stopped
    # Graylog keeps only its configuration here: a small cache is plenty
    command: ['--wiredTigerCacheSizeGB', '0.25']
    mem_limit: 512m
    networks:
      default:
        aliases: [cbf-ref-mongodb]
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.adminCommand("ping").ok']
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    logging: *local-logging

  opensearch:
    image: opensearchproject/opensearch:2.19.1
    restart: unless-stopped
    networks:
      default:
        aliases: [cbf-ref-opensearch]
    environment:
      OPENSEARCH_JAVA_OPTS: -Xms${OPENSEARCH_HEAP:-512m} -Xmx${OPENSEARCH_HEAP:-512m}
      discovery.type: single-node
      action.auto_create_index: 'false'
      # single node on a private network: no TLS / auth plugin (sets plugins.security.disabled)
      DISABLE_INSTALL_DEMO_CONFIG: 'true'
      DISABLE_SECURITY_PLUGIN: 'true'
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    # heap + off-heap (Lucene, network buffers); raise together with OPENSEARCH_HEAP
    mem_limit: ${OPENSEARCH_MEM_LIMIT:-1536m}
    volumes:
      - opensearchdata:/usr/share/opensearch/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'curl -fsS http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=5s'
        ]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    logging: *local-logging

  graylog:
    image: graylog/graylog:6.1
    restart: unless-stopped
    # the root password is kept in plain text in .env; Graylog wants its SHA-256
    entrypoint:
      - /usr/bin/tini
      - --
      - sh
      - -c
      - GRAYLOG_ROOT_PASSWORD_SHA2=$$(printf %s "$$GRAYLOG_ROOT_PASSWORD" | sha256sum | cut -d' ' -f1) exec /docker-entrypoint.sh
    environment:
      GRAYLOG_ROOT_PASSWORD: ${GRAYLOG_ROOT_PASSWORD:-}
      GRAYLOG_PASSWORD_SECRET: ${GRAYLOG_PASSWORD_SECRET:-}
      GRAYLOG_NODE_ID_FILE: /usr/share/graylog/data/config/node-id
      GRAYLOG_HTTP_BIND_ADDRESS: 0.0.0.0:9000
      GRAYLOG_HTTP_EXTERNAL_URI: ${GRAYLOG_EXTERNAL_URI:-http://127.0.0.1:9000/}
      GRAYLOG_ELASTICSEARCH_HOSTS: http://cbf-ref-opensearch:9200
      GRAYLOG_MONGODB_URI: mongodb://cbf-ref-mongodb:27017/graylog
      GRAYLOG_ROOT_TIMEZONE: Europe/Prague
      GRAYLOG_SERVER_JAVA_OPTS: -Xms${GRAYLOG_HEAP:-512m} -Xmx${GRAYLOG_HEAP:-512m}
      # disk (ADR 0009): messages waiting for OpenSearch, and the log indices (1 GiB each, the 20
      # newest kept: logs stay under ~21 GB, ~22 GB with the journal). These seed the index sets on
      # the first start; graylog-setup enforces the same limits on the default index set later.
      GRAYLOG_MESSAGE_JOURNAL_MAX_SIZE: ${GRAYLOG_JOURNAL_MAX_SIZE:-1gb}
      GRAYLOG_ROTATION_STRATEGY: size
      GRAYLOG_ELASTICSEARCH_MAX_SIZE_PER_INDEX: ${GRAYLOG_INDEX_MAX_BYTES:-1073741824}
      GRAYLOG_RETENTION_STRATEGY: delete
      GRAYLOG_ELASTICSEARCH_MAX_NUMBER_OF_INDICES: ${GRAYLOG_MAX_INDICES:-20}
    mem_limit: ${GRAYLOG_MEM_LIMIT:-1280m}
    ports:
      # GELF from the Docker daemon of this host
      - 127.0.0.1:${GELF_PORT:-12201}:12201/udp
      # web UI also through an SSH tunnel: ssh -L 9000:127.0.0.1:9000 <vps>
      - 127.0.0.1:${GRAYLOG_UI_PORT:-9000}:9000
    networks:
      default:
      # the reverse proxy reaches the web UI as cbf-ref-graylog:9000
      proxy:
        aliases: [cbf-ref-graylog]
    volumes:
      - graylogdata:/usr/share/graylog/data
    healthcheck:
      test: ['CMD-SHELL', '/health_check.sh']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 180s
    # started, not healthy: Graylog retries its stores itself, and a slow or broken logging
    # stack must never block a deploy of the app
    depends_on:
      mongodb:
        condition: service_started
      opensearch:
        condition: service_started
    logging: *local-logging

  # one-shot: GELF input + JSON extractor in Graylog (idempotent)
  graylog-setup:
    <<: *app
    restart: 'no'
    command: ['node', 'dist/graylog-setup.js']
    environment:
      GRAYLOG_INDEX_MAX_BYTES: ${GRAYLOG_INDEX_MAX_BYTES:-1073741824}
      GRAYLOG_MAX_INDICES: ${GRAYLOG_MAX_INDICES:-20}
    # waits for the Graylog API itself (up to 10 minutes)
    depends_on:
      graylog:
        condition: service_started
    logging: *local-logging

networks:
  # the reverse proxy's network (it belongs to the proxy's own stack); deploy.sh creates it if missing
  proxy:
    name: ${PROXY_NETWORK:-nginx_default}
    external: true

volumes:
  pgdata:
  rabbitmqdata:
  mongodata:
  opensearchdata:
  graylogdata:
