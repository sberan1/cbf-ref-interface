# Checks every PR and push. On master (push or a manual run) it also publishes the image to GHCR
# and deploys it to the VPS (ADR 0007, setup in deploy/README.md). Deploy is skipped until the
# VPS_HOST repository variable exists.
name: CI/CD

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}
  # publish + deploy: master, but never from a pull request
  RELEASE: ${{ github.ref == 'refs/heads/master' && github.event_name != 'pull_request' }}

jobs:
  check:
    name: Lint, types, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npx vitest --run
      - name: Migrations match the schema
        env:
          # drizzle-kit generate only diffs files, the URL is never used
          DATABASE_URL: postgres://unused@localhost/unused
        run: |
          npx drizzle-kit generate --name schema-drift
          if [ -n "$(git status --porcelain -- drizzle)" ]; then
            git status --porcelain -- drizzle
            echo "::error::The schema changed without a migration: run npm run db:generate and commit drizzle/"
            exit 1
          fi

  image:
    name: Docker image
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          provenance: false
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: scripts/docker-smoke-test.sh "$IMAGE:$GITHUB_SHA"
      - name: Log in to GHCR
        if: env.RELEASE == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        if: env.RELEASE == 'true'
        run: |
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:latest"

  deploy:
    name: Deploy to VPS
    needs: image
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request' && vars.VPS_HOST != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    env:
      VPS_HOST: ${{ vars.VPS_HOST }}
      VPS_USER: ${{ vars.VPS_USER || 'deploy' }}
      VPS_PORT: ${{ vars.VPS_SSH_PORT || '22' }}
      VPS_PATH: ${{ vars.VPS_DEPLOY_PATH || '/opt/cbf-ref' }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: deploy
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host vps
            HostName $VPS_HOST
            Port $VPS_PORT
            User $VPS_USER
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            ServerAliveInterval 30
          EOF
      - name: Upload compose file and deploy script
        run: scp deploy/compose.yaml deploy/deploy.sh "vps:$VPS_PATH/"
      - name: Pull and restart
        env:
          # the job token can pull this repo's package while the job runs; deploy.sh logs out again
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | ssh vps "sh '$VPS_PATH/deploy.sh' '$GITHUB_SHA' '$GITHUB_ACTOR'"
